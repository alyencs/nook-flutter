# Nook — save, organise and rediscover travel content.
name: nook
description: Never lose your next favourite find. Save travel posts from TikTok, Instagram, Facebook and YouTube, group them by trip, and search across all of them.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Phone frame around the app in the browser. Left on in the deployed build:
  # the live link is opened on a desktop, and a phone layout at desktop width
  # looks broken unframed.
  device_preview: ^1.3.1
  # Storage. On-device SQL, works on web. The proposal's choice.
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.4
  # Loads GEMINI_API_KEY from a git-ignored .env. Never shipped to the web build.
  flutter_dotenv: ^5.1.0
  # Profile picture on Set Up Profile and Account.
  image_picker: ^1.1.2
  # Map pins for a saved post's location. Chosen over google_maps_flutter for
  # the reason the proposal gives: no key, no billing account, works on web.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # oEmbed lookups for post thumbnails, and the Gemini REST calls. The
  # google_generative_ai package was dropped: it discards the HTTP status code,
  # which is the one thing needed to tell a retryable 503 from a fatal 400.
  http: ^1.6.0
  font_awesome_flutter: ^11.0.0
  # Opens a saved post's original URL in the platform's own browser or app.
  url_launcher: ^6.3.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true

  assets:
    # flutter_dotenv reads .env through the asset bundle, so it must be listed.
    # It is git-ignored; the deploy workflow creates one from .env.example,
    # which carries no key, so the deployed build runs the sample extractor.
    - .env
    - .env.example

  fonts:
    # Manrope, the UI typeface: body, labels, buttons, navigation. SIL OFL,
    # instanced from the upstream variable font. Licence in assets/fonts.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

    # The editorial/display face, used only for emphasis — see the note at the
    # top of lib/theme/nook_typography.dart for how to swap in PP Editorial New,
    # which is licensed and cannot be committed here.
    - family: EditorialSerif
      fonts:
        - asset: assets/fonts/EditorialSerif-Regular.ttf
        - asset: assets/fonts/EditorialSerif-Italic.ttf
          style: italic
