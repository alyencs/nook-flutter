<!DOCTYPE html>
<html>
<head>
  <!-- $FLUTTER_BASE_HREF is replaced at build time by the --base-href flag in
       the deploy workflow. Leave it exactly as it is, or your deployed site
       loads a blank white page. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nook keeps the travel content you save on TikTok, Instagram, Facebook and YouTube in one place — grouped by trip, and searchable across every platform.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#DD700B">

  <title>Nook — never lose your next favourite find</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The warm background from the design system, so the first paint matches
       the app instead of flashing white. */
    body { margin: 0; background-color: #FAFAF8; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
